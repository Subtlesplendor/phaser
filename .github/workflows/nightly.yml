name: Nightly

# Scheduled fault-discovery campaigns on the default branch, specified by
# DEVELOPMENT_WORKFLOW.md section 5.3.
#
# These are continuing campaigns, not retroactive evidence that an earlier merge
# was approved without its required bounded checks. A failure here means a defect
# to diagnose, not a merge to revert.
on:
  schedule:
    # 02:30 UTC daily. Scheduled runs execute on the default branch only.
    - cron: '30 2 * * *'
  # Allow a manual run, so the tier can be exercised without waiting a day.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Extended fuzz campaign
    runs-on: ubuntu-24.04
    # Bounded, per section 5.3's ten to thirty minute target, with headroom for
    # the toolchain install and build. The campaign stops itself well before
    # this, so the ceiling is a backstop and not the working budget: a job
    # cancelled at the ceiling cannot report what it did, which is exactly the
    # failure mode the budget below exists to avoid.
    timeout-minutes: 45

    env:
      # Per-target iteration budget. Every target must be able to finish it:
      # `zig build fuzz` declares one run per target and the build runner starts
      # at most one per core, so on a four-core runner a budget no target can
      # reach means the last four targets never start at all.
      #
      # Cold-cache measurement on the supported macOS ARM64 development machine,
      # ten cores, whole set wall and then the heaviest target
      # (value_ir_builder, whose exact-rational graph building dominates the
      # campaign):
      #
      #   200K   2m00s   1m
      #   500K   4m20s   4m
      #     1M  12m35s  12m
      #
      # Cost per input rises as the corpus grows, so the budget is not a free
      # dial. 500K is the last step that leaves headroom: a hosted runner is
      # slower and narrower, which puts the heaviest target near ten minutes
      # there and the campaign inside section 5.3's ten to thirty minute target,
      # while 1M would spend the whole backstop below. Resident memory is no
      # longer a constraint at any of these; it stays under 30 MiB per target
      # since decision 0010 moved the targets off the tracing allocator.
      FUZZ_ITERATIONS: 500K
      # Wall-clock backstop for the campaign, below `timeout-minutes` so this
      # one fires first and the job survives to report.
      FUZZ_BUDGET: 35m

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Record campaign metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "commit      ${GITHUB_SHA}"
          echo "runner      ${RUNNER_OS} ${RUNNER_ARCH}, $(nproc) cores"
          echo "zig         $("$RUNNER_TEMP/zig/zig" version)"
          echo "build_mode  ReleaseSafe"
          echo "budget      ${FUZZ_ITERATIONS} iterations per target, ${FUZZ_BUDGET} wall clock"

      # Reaching the wall-clock budget is a normal end to a campaign, not a
      # defect: this tier searches for as long as it is given, and a night that
      # runs out of clock has still fuzzed. Only a crashing input, or the tool
      # itself failing, fails the job. `timeout` puts the build runner in its own
      # process group and signals the group, so the test processes stop with it
      # rather than outliving the step. `--summary all` is what makes a campaign
      # legible afterwards: `zig build --fuzz` prints progress only to a
      # terminal, so without it a passing run's log is empty.
      - name: Run extended fuzz campaign
        shell: bash
        run: |
          set -euo pipefail
          status=0
          timeout --signal=INT --kill-after=1m "$FUZZ_BUDGET" \
            "$RUNNER_TEMP/zig/zig" build fuzz \
            -Doptimize=ReleaseSafe \
            --fuzz="$FUZZ_ITERATIONS" \
            --summary all || status=$?

          # 124 is `timeout`'s own report; 137 is the escalation to SIGKILL when
          # the campaign did not stop within the grace period.
          if [[ "$status" != 124 && "$status" != 137 ]]; then
            exit "$status"
          fi

          echo "The campaign reached its ${FUZZ_BUDGET} budget and was stopped."
          echo "No crashing input was found before then."
          {
            echo "## Extended fuzz campaign"
            echo
            echo "Stopped at its ${FUZZ_BUDGET} wall-clock budget with no crashing"
            echo "input found. The per-target budget is ${FUZZ_ITERATIONS} iterations."
            echo "A campaign that keeps ending this way is measuring a budget that no"
            echo "longer fits the runner, not a defect."
          } >> "$GITHUB_STEP_SUMMARY"

      # A discovered failure is only useful with its input, and the runner is
      # discarded when the job ends. The toolchain saves a crashing input at
      # .zig-cache/f/crash in exactly the format a committed corpus entry uses,
      # so printing it here carries the whole reproduction out in the job log
      # and no workflow artifact is needed. The failing step's log names the
      # target the input belongs to.
      - name: Report the crashing input
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .zig-cache/f/crash ]; then
            echo "No .zig-cache/f/crash present."
            echo "The failure was not a crashing input; read the campaign log above."
            exit 0
          fi
          echo "Crashing input, $(wc -c < .zig-cache/f/crash) bytes, base64:"
          base64 < .zig-cache/f/crash
          echo
          echo "To reproduce, decode into test/corpus/<target>/ and add the file to"
          echo "that target's .corpus list in test/fuzz/root.zig, then run:"
          echo "  zig build fuzz"

  property:
    name: Extended property campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Run extended property campaign
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" build test-property \
            -Doptimize=ReleaseSafe -- --extended

  mutation:
    name: Mutation campaign (rotation group)
    runs-on: ubuntu-24.04
    # A mutant costs a full cold-cache rebuild of the oracle, so this tier is
    # sized by the rotation in tools/ci/mutation_rotation.sh rather than by the
    # clock. Groups are deliberately uneven, because the rotation buys coverage
    # with balance; the heaviest currently holds about 105 mutants against an
    # average of 49. The ceiling is set for that heavy end and then some: the
    # first scheduled runs are themselves the measurement that sets GROUP_COUNT,
    # and a campaign cut off mid-run reports nothing useful. See decision 0005.
    timeout-minutes: 150

    env:
      # Nights needed for one full pass over every mutant. Raise it if a night
      # runs long; the rotation rebalances itself from the mutant listing.
      GROUP_COUNT: 14

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      # Every other job reaches the toolchain by absolute path, which is enough
      # because the only process that needs Zig is the one this workflow spawns
      # itself. Zentinel is different: it resolves `zig` by name, both for the
      # `zig version` probe that `check` makes and for the `zig build
      # test-mutation` oracle it re-runs per mutant, and it passes only an
      # allowlisted environment (PATH among it) to those commands. A hosted
      # runner ships no Zig, so without this the campaign fails at `check` with
      # ZNTL_ZIG_NOT_FOUND. GITHUB_PATH prepends, so the pinned 0.16.0 is the
      # toolchain found here even if an image ever starts carrying its own.
      - name: Put the pinned toolchain on PATH for zentinel
        shell: bash
        run: echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      # Generating the listing also builds the pinned zentinel from source, so a
      # tool or configuration fault fails here rather than after an hour of
      # mutation runs.
      - name: List mutants and validate configuration
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" build mutation -- check
          "$RUNNER_TEMP/zig/zig" build mutation -- list-mutants --format text \
            > "$RUNNER_TEMP/mutants.txt"
          echo "total mutants: $(wc -l < "$RUNNER_TEMP/mutants.txt")"

      - name: Plan tonight's rotation group
        shell: bash
        run: |
          set -euo pipefail
          # Whole days since the epoch, which is strictly increasing and never
          # restarts. Day of the year would have been simpler but repeats a
          # group and skips another every New Year, because 365 is not a
          # multiple of GROUP_COUNT. Scheduled runs are daily, so consecutive
          # nights take consecutive groups and every cell that exists for a
          # whole cycle is visited exactly once in GROUP_COUNT nights.
          index=$(( $(date -u +%s) / 86400 % GROUP_COUNT ))
          echo "MUTATION_GROUP_INDEX=$index" >> "$GITHUB_ENV"
          tools/ci/mutation_rotation.sh \
            zentinel.toml "$GROUP_COUNT" "$index" .zentinel-rotation \
            > "$RUNNER_TEMP/plan.txt"
          echo "--- plan ---"
          cat "$RUNNER_TEMP/plan.txt"

      # Survivors do not fail the job. A surviving mutant is evidence about the
      # suite to read and act on, not a regression in the commit under test, and
      # this tier has agreed no survivor threshold yet. `--fail-on-survivors` is
      # deliberately absent; zentinel still exits non-zero if the baseline fails
      # or the tool itself errors, which does fail the job.
      - name: Run the rotation group
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zig-out/zentinel
          if [[ ! -s "$RUNNER_TEMP/plan.txt" ]]; then
            echo "Tonight's rotation group holds no cells; nothing to run."
            exit 0
          fi
          while read -r operator config count; do
            echo "::group::$operator ($count mutants)"
            "$RUNNER_TEMP/zig/zig" build mutation -- \
              --config "$config" run \
              --operator "$operator" \
              --jobs 4 \
              --report text \
              --output "zig-out/zentinel/$operator.json" \
              | tee "zig-out/zentinel/$operator.txt"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/plan.txt"

      # A survivor is only useful with the file and line it survived at, and the
      # runner is discarded when the job ends. The text report already names
      # every survivor, so carrying it out in the job log and the run summary
      # needs no workflow artifact, matching how the fuzz job reports a crashing
      # input.
      - name: Report survivors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(zig-out/zentinel/*.txt)
          if (( ${#reports[@]} == 0 )); then
            echo "No mutation reports were produced; read the campaign log above."
            exit 0
          fi

          # The text report lists each surviving mutant as
          # `survived <operator> <path>:<line>` and ends with a
          # `N mutants: K killed, S survived` line per operator.
          echo "--- per-operator totals ---"
          grep -h 'mutants:' "${reports[@]}" || true
          echo "--- survivors ---"
          grep -h '^survived' "${reports[@]}" || echo "No survivors."

          {
            echo "## Mutation rotation group ${MUTATION_GROUP_INDEX} of ${GROUP_COUNT}"
            echo
            echo '```text'
            grep -h 'mutants:' "${reports[@]}" || true
            echo '```'
            echo
            echo "### Survivors"
            echo
            echo '```text'
            grep -h '^survived' "${reports[@]}" || echo "No survivors."
            echo '```'
            echo
            echo "A survivor is a mutation the bounded suite did not notice."
            echo "Reproduce one locally with:"
            echo
            echo '```sh'
            echo "zig build mutation -- --config CONFIG run --operator OPERATOR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  allocation-failure:
    name: Allocation failure and capacity campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      # The allocation-failure sweeps and exact-capacity tests live beside the
      # code they cover, so a Debug run exercises them with leak detection and
      # every safety check enabled.
      - name: Run every tier in Debug
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" build test -Doptimize=Debug
          "$RUNNER_TEMP/zig/zig" build test-integration -Doptimize=Debug
          "$RUNNER_TEMP/zig/zig" build test-conformance -Doptimize=Debug
          "$RUNNER_TEMP/zig/zig" build test-differential -Doptimize=Debug

  platforms:
    name: Broader build modes (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
          - name: macOS ARM64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Test every build mode
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe ReleaseFast ReleaseSmall; do
            "$RUNNER_TEMP/zig/zig" build test "-Doptimize=$mode"
          done

      - name: Record representative measurements
        # Informational. A hosted runner is too noisy for a threshold, per
        # DEVELOPMENT_WORKFLOW.md section 11.
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build bench'
