name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed-line whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root --no-commit-id -r HEAD
          else
            git diff --check "$BASE_SHA...HEAD"
          fi

      - name: Check local Markdown links
        shell: bash
        run: tools/ci/check_markdown_links.sh

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Verify pinned Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" version
          [[ "$("$RUNNER_TEMP/zig/zig" version)" == "$(< .zigversion)" ]]

  build-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
          - name: macOS ARM64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Build library
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build'

      - name: Test Debug
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test -Doptimize=Debug'

      - name: Test ReleaseSafe
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test -Doptimize=ReleaseSafe'

      - name: Test ReleaseFast
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test -Doptimize=ReleaseFast'

      - name: Run property tests
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test-property -Doptimize=ReleaseSafe'

      - name: Compare differential implementations
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" build test-differential -Doptimize=Debug
          "$RUNNER_TEMP/zig/zig" build test-differential -Doptimize=ReleaseFast

      - name: Run public examples
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build examples -Doptimize=ReleaseSafe'

      - name: Run command-line client tests
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test-cli -Doptimize=ReleaseSafe'

  fuzz-smoke:
    name: Bounded fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Run bounded fuzz campaign across every target
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build fuzz -Doptimize=ReleaseSafe --fuzz=1000'
