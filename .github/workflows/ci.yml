name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed-line whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root --no-commit-id -r HEAD
          else
            git diff --check "$BASE_SHA...HEAD"
          fi

      - name: Check local Markdown links
        shell: bash
        run: tools/ci/check_markdown_links.sh

      # Phaser does not version notebook outputs, and a frontend stores them on
      # save. Standard library only, so this belongs in the tier that installs
      # no Python environment.
      - name: Check committed notebooks carry no outputs
        shell: bash
        run: python3 tools/ci/check_notebook_outputs.py

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Verify pinned Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" version
          [[ "$("$RUNNER_TEMP/zig/zig" version)" == "$(< .zigversion)" ]]

  build-test-linux:
    name: Build and test (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Build library
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build -Doptimize=ReleaseSafe'

      - name: Check the C ABI with independent compilers
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/prefix"
          tools/ci/check_abi.sh "$RUNNER_TEMP/prefix"

      # The Python binding, per decision 0015. The runner's interpreter is used
      # as it comes; nothing is installed from PyPI, because nothing in this
      # tier needs a package yet. The plotting and notebook packages that
      # decision approved arrive with the notebook that requires them.
      - name: Test the Python binding
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          "$RUNNER_TEMP/zig/zig" build test-python \
            -Doptimize=ReleaseSafe -Dpython="$(command -v python3)"

      # The notebook tier, per decision 0015. Linux only, deliberately: the
      # numbers the notebook plots are asserted on all three platforms by tests
      # that need none of these packages, so executing it elsewhere would check
      # that matplotlib renders rather than that Phaser computes.
      #
      # A virtual environment because Ubuntu's interpreter is externally
      # managed and refuses installs into itself. The extension is built
      # against the same interpreter and uses the Stable ABI, so it loads here
      # unchanged.
      #
      # `--require-hashes` makes every entry pinned and hashed or the install
      # fails; `--no-deps` makes the pinned set exhaustive rather than a
      # starting point for resolution.
      - name: Install the pinned notebook environment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/notebook-venv"
          "$RUNNER_TEMP/notebook-venv/bin/python" -m pip install \
            --require-hashes --no-deps \
            -r tools/ci/python-requirements.txt

      - name: Execute the notebooks from a fresh kernel
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          # A fixed non-interactive backend, so a figure renders identically
          # and without a display.
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}/zig-out/python
          PHASER_EXAMPLES: ${{ github.workspace }}/examples
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/notebook-venv/bin/python" tools/ci/run_notebook.py \
            docs/notebooks/scalar_effective_potential.ipynb

      - name: Test deterministic core in Debug
        if: github.event_name == 'pull_request'
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test-core -Doptimize=Debug'

      - name: Test full suite in ReleaseSafe
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test -Doptimize=ReleaseSafe'

      - name: Generate and test the narrow AOT prototype
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" build test-aot-prototype
          "$RUNNER_TEMP/zig/zig" build test-aot-prototype -Doptimize=ReleaseFast

      - name: Compare differential implementations
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" build test-differential -Doptimize=Debug
          "$RUNNER_TEMP/zig/zig" build test-differential -Doptimize=ReleaseFast

      - name: Run public examples
        if: github.event_name == 'pull_request'
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build examples -Doptimize=ReleaseSafe'

  build-test-macos:
    name: Build and test (macOS ARM64)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Build library
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build -Doptimize=ReleaseSafe'

      - name: Check the C ABI with independent compilers
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig" build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/prefix"
          tools/ci/check_abi.sh "$RUNNER_TEMP/prefix"

      - name: Test full suite in ReleaseSafe
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test -Doptimize=ReleaseSafe'

      - name: Generate and test the narrow AOT prototype
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig" build test-aot-prototype'

      - name: Test the Python binding
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          "$RUNNER_TEMP/zig/zig" build test-python \
            -Doptimize=ReleaseSafe -Dpython="$(command -v python3)"

  build-test-windows:
    name: Build and test (Windows x86-64)
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Git Bash is preinstalled, so the same installer serves all three
      # platforms rather than growing a PowerShell twin.
      - name: Install pinned Zig toolchain
        shell: bash
        run: tools/ci/install_zig.sh "$RUNNER_TEMP/zig"

      - name: Verify pinned Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig.exe" version
          [[ "$("$RUNNER_TEMP/zig/zig.exe" version)" == "$(< .zigversion)" ]]

      - name: Build library
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig.exe" build -Doptimize=ReleaseSafe'

      - name: Test full suite in ReleaseSafe
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig.exe" build test -Doptimize=ReleaseSafe'

      - name: Generate and test the narrow AOT prototype
        shell: bash
        run: '"$RUNNER_TEMP/zig/zig.exe" build test-aot-prototype'

      - name: Install to a prefix for the ABI checks
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zig/zig.exe" build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/prefix"

      # MSVC and dumpbin are the independent toolchain here, located through the
      # preinstalled vswhere rather than a setup action.
      - name: Check the C ABI with MSVC
        shell: pwsh
        run: tools/ci/check_abi.ps1 -Prefix "$env:RUNNER_TEMP/prefix"

      # Unlike ELF and Mach-O, a Windows extension cannot leave the
      # interpreter's symbols undefined, so it links the Limited API stub.
      - name: Test the Python binding
        shell: bash
        run: |
          set -euo pipefail
          python --version
          "$RUNNER_TEMP/zig/zig.exe" build test-python \
            -Doptimize=ReleaseSafe -Dpython="$(command -v python)"
